<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#16a34a" />
    <meta
      name="description"
      content="HydroGalicia - Sustainable hydroponic farming in Pontevedra, Galicia. Fresh, locally grown produce using innovative greenhouse cultivation techniques."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    
    <!-- Meta tags for SEO -->
    <meta name="keywords" content="hydroponics, sustainable farming, Galicia, greenhouse, organic produce, local food, lettuce, tomatoes, herbs, agriculture technology" />
    <meta name="author" content="HydroGalicia" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="HydroGalicia - Sustainable Hydroponic Farming" />
    <meta property="og:description" content="Fresh, locally grown produce using innovative hydroponic techniques in Pontevedra, Galicia. Better for you, better for the planet." />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.jpg" />
    <meta property="og:url" content="https://hydrogalicia.com" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HydroGalicia - Sustainable Hydroponic Farming" />
    <meta name="twitter:description" content="Fresh, locally grown produce using innovative hydroponic techniques in Pontevedra, Galicia." />
    <meta name="twitter:image" content="%PUBLIC_URL%/twitter-image.jpg" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <title>HydroGalicia | Sustainable Hydroponic Farming in Galicia</title>
    
    <style>
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      }
      
      /* Loading state style */
      .app-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
        background-color: #f9fafb;
      }
      
      .app-loading__spinner {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        border: 3px solid rgba(22, 163, 74, 0.2);
        border-top-color: #16a34a;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      
      .app-loading__text {
        color: #16a34a;
        font-weight: 500;
      }
      
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <!-- Initial loading state while React loads -->
      <div class="app-loading">
        <div class="app-loading__spinner"></div>
        <div class="app-loading__text">Loading HydroGalicia...</div>
      </div>
    </div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
